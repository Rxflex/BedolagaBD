<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Что детектит ТСПУ и чем закрывают">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/><stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 H 0 V 26" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b6b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff6b6b" stop-opacity="0.08"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .h{font-size:22px;font-weight:700;fill:#e6edf3}
      .bh{font-size:15.5px;font-weight:700;fill:#e6edf3}
      .s{font-size:13px;fill:#8b949e}
      .xs{font-size:11.5px;fill:#8b949e}
      .cap{font-size:12.5px;font-weight:700;letter-spacing:2px}
    </style>
  </defs>

  <rect width="1200" height="560" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="560" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="560" rx="16" fill="none" stroke="#ff6b6b" stroke-opacity="0.3"/>

  <text x="36" y="48" class="t h">ТСПУ: что видит и чем закрывались</text>
  <text x="36" y="72" class="t s">Левая колонка — признак, по которому режут. Правая — что помогало по опыту чата. Даты — когда прижало.</text>

  <!-- стена -->
  <rect x="470" y="104" width="86" height="424" rx="10" fill="url(#wall)" stroke="#ff6b6b" stroke-opacity="0.5"/>
  <text x="513" y="300" class="t cap" fill="#ff6b6b" text-anchor="middle" transform="rotate(-90 513 300)">ТСПУ · ДПИ</text>

  <text x="36" y="108" class="t cap" fill="#ff6b6b">ПРИЗНАК ДЕТЕКТА</text>
  <text x="600" y="108" class="t cap" fill="#06d6a0">ЧЕМ ЗАКРЫВАЛИ</text>

  <!-- строки -->
  <g>
    <rect x="30" y="124" width="420" height="72" rx="10" fill="#ff6b6b" fill-opacity="0.06" stroke="#ff6b6b" stroke-opacity="0.35"/>
    <text x="48" y="150" class="t bh">uTLS-фингерпринт (chrome)</text>
    <text x="48" y="174" class="t xs">25–27.05.2026 · «пинг есть, но не работает», Сибирь/ДВ</text>
    <rect x="576" y="124" width="592" height="72" rx="10" fill="#06d6a0" fill-opacity="0.06" stroke="#06d6a0" stroke-opacity="0.35"/>
    <text x="594" y="150" class="t bh">Смена fingerprint, xhttp вместо raw</text>
    <text x="594" y="174" class="t xs">firefox/safari/randomized; на xhttp отпечаток перестаёт быть якорем</text>
  </g>

  <g>
    <rect x="30" y="208" width="420" height="72" rx="10" fill="#ff6b6b" fill-opacity="0.06" stroke="#ff6b6b" stroke-opacity="0.35"/>
    <text x="48" y="234" class="t bh">TLS-in-TLS, активный спуфинг</text>
    <text x="48" y="258" class="t xs">04–05.06.2026 · подсовывают своё рукопожатие, ломают Reality</text>
    <rect x="576" y="208" width="592" height="72" rx="10" fill="#06d6a0" fill-opacity="0.06" stroke="#06d6a0" stroke-opacity="0.35"/>
    <text x="594" y="234" class="t bh">Hysteria2 под обфускацией, gRPC</text>
    <text x="594" y="258" class="t xs">UDP-транспорт не подпадает под TLS-анализ; gRPC как резерв</text>
  </g>

  <g>
    <rect x="30" y="292" width="420" height="72" rx="10" fill="#ff6b6b" fill-opacity="0.06" stroke="#ff6b6b" stroke-opacity="0.35"/>
    <text x="48" y="318" class="t bh">SNI и домен назначения</text>
    <text x="48" y="342" class="t xs">весь период · чужой популярный SNI горит первым</text>
    <rect x="576" y="292" width="592" height="72" rx="10" fill="#06d6a0" fill-opacity="0.06" stroke="#06d6a0" stroke-opacity="0.35"/>
    <text x="594" y="318" class="t bh">Selfsteal: свой домен + свой сайт-заглушка</text>
    <text x="594" y="342" class="t xs">Caddy на двух портах, реальный контент на 443 — проверяют глазами</text>
  </g>

  <g>
    <rect x="30" y="376" width="420" height="72" rx="10" fill="#ff6b6b" fill-opacity="0.06" stroke="#ff6b6b" stroke-opacity="0.35"/>
    <text x="48" y="402" class="t bh">IP и подсеть хостера</text>
    <text x="48" y="426" class="t xs">04.08.2026 · банят ноды пачками; к 23.08 бан по /32, а не /24</text>
    <rect x="576" y="376" width="592" height="72" rx="10" fill="#06d6a0" fill-opacity="0.06" stroke="#06d6a0" stroke-opacity="0.35"/>
    <text x="594" y="402" class="t bh">БС-подсети РФ, CDN-фронтинг, мосты RU→EU</text>
    <text x="594" y="426" class="t xs">пока живы: мост в РФ + выход в ЕС; CDN-аккаунты снесли в 08.2026</text>
  </g>

  <g>
    <rect x="30" y="460" width="420" height="68" rx="10" fill="#ff6b6b" fill-opacity="0.06" stroke="#ff6b6b" stroke-opacity="0.35"/>
    <text x="48" y="486" class="t bh">Шейпинг вместо блока</text>
    <text x="48" y="510" class="t xs">16.08.2026 · режут upload в Сибири, Ростелеком до 40 Мбит/с за бугор</text>
    <rect x="576" y="460" width="592" height="68" rx="10" fill="#06d6a0" fill-opacity="0.06" stroke="#06d6a0" stroke-opacity="0.35"/>
    <text x="594" y="486" class="t bh">Мост, BBR, MTU, finalmask-транспорты</text>
    <text x="594" y="510" class="t xs">мост «фиксит» шейпинг; SSH/DNS/XMC — экзотика августа 2026</text>
  </g>

  <line x1="450" y1="160" x2="576" y2="160" stroke="#8b949e" stroke-width="1.4" stroke-opacity="0.5" marker-end="url(#ar)"/>
  <line x1="450" y1="244" x2="576" y2="244" stroke="#8b949e" stroke-width="1.4" stroke-opacity="0.5" marker-end="url(#ar)"/>
  <line x1="450" y1="328" x2="576" y2="328" stroke="#8b949e" stroke-width="1.4" stroke-opacity="0.5" marker-end="url(#ar)"/>
  <line x1="450" y1="412" x2="576" y2="412" stroke="#8b949e" stroke-width="1.4" stroke-opacity="0.5" marker-end="url(#ar)"/>
  <line x1="450" y1="494" x2="576" y2="494" stroke="#8b949e" stroke-width="1.4" stroke-opacity="0.5" marker-end="url(#ar)"/>

  <text x="1164" y="546" class="t m" font-size="11.5" fill="#8b949e" fill-opacity="0.6" text-anchor="end">assets/diagrams/tspu-detect.svg</text>
</svg>
